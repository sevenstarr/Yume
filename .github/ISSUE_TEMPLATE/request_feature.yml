# Modified for Yume on 2026-10-19: fork scope and status-aware feature requests.
name: Sugestão para o Yume
description: Proponha uma melhoria para o fork Yume.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade
      description: Explique o caso de uso e o resultado esperado.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução sugerida e alternativas
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Antes de enviar
      options:
        - label: Pesquisei issues existentes e li o estado atual no README.
          required: true
        - label: Esta proposta trata do Yume; problemas exclusivos de uma extensão pertencem ao projeto da extensão.
          required: true
