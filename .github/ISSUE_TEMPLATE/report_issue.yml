# Modified for Yume on 2026-10-19: fork diagnostics without personal data or upstream version requirements.
name: Reportar falha no Yume
description: Informe uma falha reproduzível; vulnerabilidades seguem SECURITY.md.
body:
  - type: markdown
    attributes:
      value: |
        Não inclua tokens, backups, bancos pessoais nem logs sem remover dados sensíveis.
        Para vulnerabilidades, siga SECURITY.md e use apenas um canal privado confirmado.
  - type: input
    id: version
    attributes:
      label: Versão ou commit Yume e origem do build
      description: Nesta fase não há APK oficial Yume; informe o SHA se compilou localmente.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Android, aparelho e variante do app
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos mínimos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Resultado esperado e observado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências opcionais, com dados sensíveis removidos
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Antes de enviar
      options:
        - label: Pesquisei issues existentes e li o estado atual no README.
          required: true
        - label: Este relato não contém segredos nem detalhes de vulnerabilidade explorável.
          required: true
