# Yume modification 2026-10-22: secret-free debug CI and temporary artifacts; assisted by Codex.
name: Build & Test
on:
  pull_request:
    branches:
      - yume-develop
      - yume-main
  push:
    branches:
      - yume-develop
      - yume-main
      - 'feature/**'
      - 'fix/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test App
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/yume-develop' && github.ref != 'refs/heads/yume-main') }}

      - name: Install required Android SDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager" || { echo "Android Command-line Tools missing: $sdk_manager" >&2; exit 1; }
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdk_manager" --sdk_root="$sdk_root" 'platforms;android-37.2' 'build-tools;36.0.0' 'build-tools;37.0.0'

      - name: Check code format
        run: ./gradlew spotlessCheck -Pdist=ci --console=plain --max-workers=2

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest -Pdist=ci --console=plain --max-workers=2

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration -Pdist=ci --console=plain --max-workers=2

      - name: Run Android lint
        run: ./gradlew :app:lintDebug :data:lintDebug :source-local:lintDebug :presentation-widget:lintDebug -Pdist=ci --console=plain --max-workers=2

      - name: Check migration data and report completeness
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/verify-metadata-migration.py
          python3 scripts/verify-metadata-sync-migration.py
          python3 scripts/check-ci-reports.py

      - name: Upload test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/testDebugUnitTest/
            **/build/reports/lint-results-debug.*
          retention-days: 7

      - name: Build app
        run: ./gradlew :app:assembleDebug -Pdist=ci --console=plain --max-workers=2

      - name: Verify debug APK signatures and prepare checksums
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/debug/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
          done
          python3 scripts/package-ci-apks.py --variant debug --output build/ci-apks

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yume-debug-${{ github.sha }}
          path: build/ci-apks/
          if-no-files-found: error
          retention-days: 7
