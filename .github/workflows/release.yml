# Yume modification 2026-10-22: manual candidate only, no publication; assisted by Codex.
name: Release candidate

on:
  workflow_dispatch:
    inputs:
      approved:
        description: Owner authorized this signed candidate (does not publish a release)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build signed candidate
    if: github.repository == 'sevenstarr/Yume' && github.ref == 'refs/heads/yume-main' && inputs.approved
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment: release-signing
    defaults:
      run:
        shell: bash
    steps:
      - name: Check signing readiness
        env:
          SIGNING_READY: ${{ vars.YUME_RELEASE_SIGNING_READY }}
        run: |
          test "$SIGNING_READY" = true || {
            echo 'Owner must configure and protect release-signing before enabling candidates.' >&2
            exit 1
          }

      - name: Checkout approved main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle without cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-disabled: true

      - name: Install required Android SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0' 'build-tools;37.0.0'

      - name: Validate candidate sources
        run: |
          ./gradlew spotlessCheck testDebugUnitTest verifySqlDelightMigration :app:lintDebug :data:lintDebug :source-local:lintDebug :presentation-widget:lintDebug -Pdist=github --console=plain --max-workers=2
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/verify-metadata-migration.py
          python3 scripts/verify-metadata-sync-migration.py
          python3 scripts/check-ci-reports.py

      - name: Build with owner signing key
        env:
          YUME_RELEASE_SIGNING: 'true'
          YUME_KEYSTORE_BASE64: ${{ secrets.YUME_KEYSTORE_BASE64 }}
          YUME_KEYSTORE_PATH: ${{ runner.temp }}/yume-release.jks
          YUME_STORE_PASSWORD: ${{ secrets.YUME_STORE_PASSWORD }}
          YUME_KEY_ALIAS: ${{ secrets.YUME_KEY_ALIAS }}
          YUME_KEY_PASSWORD: ${{ secrets.YUME_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f -- "$YUME_KEYSTORE_PATH"' EXIT
          test -n "$YUME_KEYSTORE_BASE64"
          printf '%s' "$YUME_KEYSTORE_BASE64" | base64 --decode > "$YUME_KEYSTORE_PATH"
          unset YUME_KEYSTORE_BASE64
          ./gradlew :app:assembleRelease -Pdist=github --no-daemon --no-configuration-cache --no-isolated-projects --console=plain --max-workers=2

      - name: Verify candidate certificate and prepare checksums
        env:
          EXPECTED_CERTIFICATE: ${{ vars.YUME_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_CERTIFICATE"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
            actual=$(sed -n 's/^.*certificate SHA-256 digest: //p' "$apk.signature.txt" | tr -d '\r' | sort -u)
            test "$actual" = "$EXPECTED_CERTIFICATE"
          done
          test -s app/build/outputs/mapping/release/mapping.txt
          python3 scripts/package-ci-apks.py --variant release --output build/release-candidate

      - name: Upload signed candidate (not a GitHub Release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yume-release-candidate-${{ github.sha }}
          path: |
            build/release-candidate/
            app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary keystore
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/yume-release.jks"
